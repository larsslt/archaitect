[project]
name = "archaitect-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.6,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4", "pypdf>=6,<7", "ifcopenshell>=0.8,<0.9", "jsonschema>=4,<5", "numpy>=2,<3", "pillow>=10"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 110
